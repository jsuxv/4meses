  @keyframes drift{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.08) translate3d(-1.2%,-1%,0)}}
  #veil{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 46%,rgba(8,2,8,.55) 100%)}
  #stars{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  #stars i{position:absolute;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 6px 1px rgba(255,180,215,.75);
           animation:tw var(--d) ease-in-out var(--l) infinite}
  @keyframes tw{0%,100%{opacity:0;transform:scale(.5)}50%{opacity:var(--o);transform:scale(1)}}

  /* ---------- página 1: el corazón botón ---------- */
  #heart{position:fixed;left:50%;top:49%;width:calc(var(--B)*.40);aspect-ratio:var(--ar);transform:translate(-50%,-50%);
         background:none;border:0;padding:0;cursor:pointer;z-index:5;outline:none;-webkit-appearance:none;appearance:none}
  #heart::after{content:"";position:absolute;inset:-28%}                       /* zona táctil más grande */
  #heart .glow{position:absolute;left:50%;top:50%;width:250%;height:250%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
               background:radial-gradient(circle,rgba(255,40,72,.55) 0%,rgba(255,30,60,.22) 30%,rgba(255,30,60,0) 64%);
               animation:glow 1.7s ease-in-out infinite}
  #heart img{position:relative;display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none;
             filter:drop-shadow(0 0 10px rgba(255,50,80,.85)) drop-shadow(0 0 28px rgba(255,20,60,.55));
             animation:beat 1.7s ease-in-out infinite}
  #heart .ring{position:absolute;left:50%;top:50%;width:112%;aspect-ratio:1;border-radius:50%;pointer-events:none;opacity:0;
               border:2px solid rgba(255,80,110,.65);transform:translate(-50%,-50%) scale(.55);animation:ring 3.1s ease-out infinite}
  #heart .ring:nth-of-type(2){animation-delay:1.03s}
  #heart .ring:nth-of-type(3){animation-delay:2.06s}
  #heart:focus-visible img{filter:drop-shadow(0 0 0 #fff) drop-shadow(0 0 16px #fff)}
  @media (hover:hover){#heart:hover img{transform:scale(1.04);transition:transform .25s}}
  @keyframes beat{0%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(1.02)}36%{transform:scale(1.09)}56%,100%{transform:scale(1)}}
  @keyframes glow{0%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}
                  24%{opacity:.65}36%{opacity:.95}60%,100%{opacity:.55;transform:translate(-50%,-50%) scale(.92)}}
  @keyframes ring{0%{opacity:.85;transform:translate(-50%,-50%) scale(.55)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5)}}

  #hint{position:fixed;left:50%;top:calc(49% + var(--B)*.30);transform:translateX(-50%);z-index:5;white-space:nowrap;pointer-events:none;
        font-style:normal;font-weight:500;font-size:max(18px,calc(var(--B)*.056));letter-spacing:.05em;color:rgba(255,168,186,.92);
        text-shadow:0 0 12px rgba(255,40,72,.7);animation:hint 2.6s ease-in-out infinite}
  @keyframes hint{0%,100%{opacity:.35}50%{opacity:1}}
  #bloom{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:6;
         background:radial-gradient(circle at 50% 49%,rgba(255,130,150,.9) 0%,rgba(255,40,72,.55) 26%,rgba(255,20,60,0) 62%)}
  .bh{position:fixed;left:50%;top:49%;z-index:7;pointer-events:none;color:#ff4d6a;text-shadow:0 0 12px rgba(255,40,70,.95)}

  /* ---------- texto de la carta y frases ---------- */
  #say{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,780px);z-index:4;pointer-events:none;
       padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);opacity:0;transition:opacity .9s ease;
       text-align:center;color:var(--red);font-style:normal;font-weight:500;line-height:1.42;letter-spacing:.01em;
       font-size:clamp(24px,min(6.9vw,4.8vh),54px);
       text-shadow:0 2px 4px rgba(0,0,0,.55),0 0 9px rgba(255,46,77,.55),0 0 28px rgba(255,20,60,.38)}
  #say .w{display:inline-block;white-space:nowrap}
  #say .c{position:relative;display:inline-block;opacity:0;transform:translateY(.22em);filter:blur(3px);
          transition:opacity .5s ease,transform .5s ease,filter .5s ease}
  #say .c.on{opacity:1;transform:none;filter:none}
  #say .c.cur::after{content:"";position:absolute;right:-.1em;top:.14em;bottom:.06em;width:2px;background:var(--red);
                     box-shadow:0 0 8px var(--red);animation:blink .8s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #say.phrase{font-size:clamp(26px,min(7.6vw,5.2vh),60px)}
  #say.finale{font-size:clamp(30px,min(9vw,6.2vh),72px);
              text-shadow:0 2px 4px rgba(0,0,0,.55),0 0 12px rgba(255,46,77,.75),0 0 40px rgba(255,20,60,.55)}

  /* ---------- el corazón de tu código ---------- */
  canvas.layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #hglow{position:fixed;left:50%;top:50%;width:min(130vw,110vh);aspect-ratio:1;transform:translate(-50%,-50%) scale(.96);z-index:1;
         pointer-events:none;opacity:0;transition:opacity 3.5s ease;
         background:radial-gradient(circle,rgba(255,70,130,.30) 0%,rgba(255,40,100,.12) 32%,rgba(255,40,100,0) 62%)}
  #hglow.on{opacity:1;animation:hg 2.3s ease-in-out infinite}
  @keyframes hg{0%{transform:translate(-50%,-50%) scale(.96)}10%{transform:translate(-50%,-50%) scale(1.06)}22%{transform:translate(-50%,-50%) scale(.98)}
                34%{transform:translate(-50%,-50%) scale(1.04)}54%,100%{transform:translate(-50%,-50%) scale(.96)}}
  #code,#code2{z-index:3}
  #code.beat,#code2.beat{animation:hb 2.3s ease-in-out infinite}
  @keyframes hb{0%{transform:scale(1)}10%{transform:scale(1.035)}22%{transform:scale(1.006)}34%{transform:scale(1.026)}54%,100%{transform:scale(1)}}

  /* ---------- botón de sonido ---------- */
  #sound{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
         width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#ff6b86;
         background:rgba(28,8,26,.55);border:1px solid rgba(255,90,120,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
         box-shadow:0 2px 14px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .9s ease,transform .15s ease}
  #sound.show{opacity:1;pointer-events:auto}
  #sound:active{transform:scale(.92)}
  #sound:focus-visible{outline:3px solid #fff;outline-offset:2px}
  #sound svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #sound .off{display:none}#sound.muted .on{display:none}#sound.muted .off{display:block}

  @media (prefers-reduced-motion:reduce){
    #bg,#stars i,#heart .ring,#hint,#hglow.on,#code.beat,#code2.beat{animation:none}
    #stars i{opacity:.5}
  }
</style>
</head>
<body>

<div id="bg" aria-hidden="true"></div>
<div id="stars" aria-hidden="true"></div>
<div id="veil" aria-hidden="true"></div>

<button id="heart" type="button" aria-label="Toca el corazón para comenzar">

   ===================================================================== */
const Q = .95, BAR = Q * 4;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CH = [                                          // bajo + notas de la mano derecha
  {b:50, t:[62,66,69,74]}, {b:45, t:[61,64,69,73]}, {b:47, t:[59,62,66,71]}, {b:42, t:[57,61,66,69]},
  {b:43, t:[59,62,67,71]}, {b:50, t:[62,66,69,74]}, {b:43, t:[59,62,67,71]}, {b:45, t:[61,64,69,73]}
];
const ARP = [0,1,2,3,2,1,2,1];
const M1 = [ [[0,78,2],[2,76,1],[3,74,1]], [[0,73,2],[2,76,2]], [[0,74,2],[2,78,1],[3,74,1]], [[0,73,2],[2,69,1],[3,73,1]],
             [[0,71,2],[2,74,1],[3,71,1]], [[0,69,2],[2,74,2]], [[0,71,1],[1,74,1],[2,79,2]], [[0,76,2],[2,73,1],[3,76,1]] ];
const M2 = [ [[0,81,1.5],[1.5,78,.5],[2,81,1],[3,83,1]], [[0,85,2],[2,83,1],[3,81,1]], [[0,83,1.5],[1.5,81,.5],[2,78,2]], [[0,78,1],[1,81,1],[2,85,2]],
             [[0,83,1.5],[1.5,79,.5],[2,83,1],[3,86,1]], [[0,86,1],[1,81,1],[2,78,2]], [[0,79,1],[1,83,1],[2,86,2]], [[0,85,2],[2,81,1],[3,76,1]] ];

function impulse(ctx, sec, decay){
  const n = Math.floor(ctx.sampleRate * sec), buf = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++){ const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
  return buf;
}
function Synth(ctx){
  const master = ctx.createGain(); master.gain.value = 0;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 20; comp.ratio.value = 3; comp.attack.value = .006; comp.release.value = .25;
  const bus = ctx.createGain(), dry = ctx.createGain(), wet = ctx.createGain(), conv = ctx.createConvolver();
  dry.gain.value = .82; wet.gain.value = .34; conv.buffer = impulse(ctx, 3.4, 2.4);
  bus.connect(dry); bus.connect(conv); conv.connect(wet);
  dry.connect(comp); wet.connect(comp); comp.connect(master); master.connect(ctx.destination);

  const AMP = [1, .62, .34, .2, .11, .07];
  function note(m, t, vel, dur){
    const f = mtof(m), L = Math.min(5, Math.max(1.3, dur + 1.6));
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = .4;        // brillo que se apaga = golpe de martillo
    lp.frequency.setValueAtTime(Math.min(9000, f * 9), t);
    lp.frequency.exponentialRampToValueAtTime(Math.max(700, f * 2.6), t + .9);
    lp.connect(bus);
    AMP.forEach((a, i) => {
      const k = i + 1, o = ctx.createOscillator(), g = ctx.createGain(), end = t + L / Math.pow(k, .55);
      o.type = 'sine'; o.frequency.value = f * k * (1 + .00035 * k * k);
      g.gain.setValueAtTime(.0001, t);
      g.gain.linearRampToValueAtTime(vel * a, t + .005);
      g.gain.exponentialRampToValueAtTime(vel * a * .35, t + .25);
      g.gain.exponentialRampToValueAtTime(.0001, end);
      o.connect(g); g.connect(lp); o.start(t); o.stop(end + .05);
      if (i === 0){                                                                  // segunda cuerda apenas desafinada
        const o2 = ctx.createOscillator(), g2 = ctx.createGain();
        o2.type = 'sine'; o2.frequency.value = f * 1.0018;
        g2.gain.setValueAtTime(.0001, t); g2.gain.linearRampToValueAtTime(vel * .45, t + .005);
        g2.gain.exponentialRampToValueAtTime(.0001, end); o2.connect(g2); g2.connect(lp); o2.start(t); o2.stop(end + .05);
      }
    });
  }
  function playBar(n, t){
    const i = n % 8, pass = Math.floor(n / 8) % 2, c = CH[i], h = () => (Math.random() - .5) * .012;
    note(c.b, t, .34, 3.6);
    note(c.b + 7, t + 2 * Q, .18, 1.8);
    ARP.forEach((k, s) => note(c.t[k], t + s * Q / 2 + h(), s === 0 ? .15 : (s % 2 ? .085 : .11), 1.6));
    (pass ? M2 : M1)[i].forEach(([b, m, d]) => note(m, t + b * Q + h(), .26, d * Q));
  }
  return { master, playBar };
}
window.__Synth = Synth; window.__BAR = BAR;

const Music = (() => {
  let ctx = null, synth = null, timer = null, started = false, muted = false, bar = 0, next = 0;
  const LEVEL = .7;
  function tick(){ while (next < ctx.currentTime + 1.6){ synth.playBar(bar, next); next += BAR; bar++; } }
  function start(){
    if (started) return; started = true;
    $('#sound').classList.add('show');
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); if (ctx.state === 'suspended') ctx.resume();
    synth = Synth(ctx);
    synth.master.gain.setTargetAtTime(muted ? 0 : LEVEL, ctx.currentTime, 1.1);       // entra suave
    next = ctx.currentTime + .25; tick(); timer = setInterval(tick, 300);
  }
  function toggle(){
    muted = !muted;
    $('#sound').classList.toggle('muted', muted);
    $('#sound').setAttribute('aria-label', muted ? 'Activar la música' : 'Silenciar la música');
    if (synth) synth.master.gain.setTargetAtTime(muted ? 0 : LEVEL, ctx.currentTime, .15);
  }
  document.addEventListener('visibilitychange', () => {
    if (!ctx) return;
    if (document.hidden) ctx.suspend(); else if (!muted) ctx.resume();
  });
  return { start, toggle };
})();
$('#sound').addEventListener('click', Music.toggle);

/* =====================================================================
   TEXTO: la carta se escribe poco a poco, por partes
   ===================================================================== */
const say = $('#say');
function buildBlock(text){
  say.innerHTML = '';
  const chars = [];
  text.split(' ').forEach((w, wi, arr) => {
    const ws = document.createElement('span'); ws.className = 'w';
    [...w].forEach(ch => { const c = document.createElement('span'); c.className = 'c'; c.textContent = ch; ws.appendChild(c); chars.push(c); });
    say.appendChild(ws);
    if (wi < arr.length - 1) say.appendChild(document.createTextNode(' '));
  });
  return chars;
}
async function showSay(cls){                                   // muestra el contenedor desde cero
  say.style.transition = 'none'; say.style.opacity = 0; say.className = cls || '';
  void say.offsetWidth; say.style.transition = ''; say.style.opacity = 1;
}
async function hideSay(){ say.style.opacity = 0; await sleep(900); }

async function typeBlock(text){
  const chars = buildBlock(text);
  await showSay('');
  let prev = null;
  for (const c of chars){
    if (prev) prev.classList.remove('cur');
    c.classList.add('on', 'cur'); prev = c;
    const ch = c.textContent;
    await sleep(TYPE_MS + Math.random() * 26 + (ch === ',' || ch === '.' ? 300 : 0));
  }
  await sleep(900 + text.split(' ').length * 110);
  prev.classList.remove('cur');
  await hideSay();
}
async function showPhrase(text, last){
  say.textContent = text;
  await showSay(last ? 'phrase finale' : 'phrase');
  const inn = say.animate([{transform:'translate(-50%,-46%)',filter:'blur(6px)'},{transform:'translate(-50%,-50%)',filter:'blur(0)'}],
                          {duration: 900 / K, easing: 'ease-out'});
  const words = text.split(' ').length;
  await sleep(PHRASE_HOLD + words * 190 + (last ? 1800 : 0));
  await hideSay();
}

/* =====================================================================
   EL CORAZÓN DE TU CÓDIGO (Python turtle → JavaScript)
   Misma ecuación, mismas 2 capas de trazos (5000 + 3500), mismos rosados y grosores.
   ===================================================================== */
const glow = $('#hglow');
const LAYERS = [$('#code'), $('#code2')].map(cv => ({ cv, gc: cv.getContext('2d'), strokes: [], drawn: 0, t0: 0, tf: 0, phase: '' }));
let W = 0, H = 0, DPR = 1, S = 1, CX = 0, CY = 0;
const heartXY = (a, sc) => [16 * Math.pow(Math.sin(a), 3) * sc,
  (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * sc];
const mapX = x => CX + x * S, mapY = y => CY - (y + 40) * S;         // el corazón mide ~512 × 464 px en el código original
const rgb = (r, g2, b) => `rgb(${r * 255 | 0},${g2 * 255 | 0},${b * 255 | 0})`;

function geom(){
  W = innerWidth; H = innerHeight; DPR = Math.min(window.devicePixelRatio || 1, 2);
  S = Math.min(W * .92 / 512, H * .74 / 464); CX = W / 2; CY = H / 2;
  for (const L of LAYERS){
    L.cv.width = Math.round(W * DPR); L.cv.height = Math.round(H * DPR);
    L.gc.setTransform(DPR, 0, 0, DPR, 0, 0); L.gc.lineCap = 'round';
    L.cv.style.transformOrigin = `${CX}px ${CY}px`;
  }
}
function makeStrokes(){                                              // [x1, y1, x2, y2, color, grosor]
  const out = [];
  for (let i = 0; i < 5000; i++){                                     // capa 1: relleno del corazón
    const a = rnd(0, Math.PI * 2), [x, y] = heartXY(a, rnd(.5, 15.5)), ang = Math.atan2(y, x) + rnd(-.5, .5), len = rnd(4, 14);
    out.push([x, y, x + len * Math.cos(ang), y + len * Math.sin(ang), rgb(1, rnd(.25, .55), rnd(.65, .85)), rnd(.5, 1.2)]);
  }
  for (let i = 0; i < 3500; i++){                                     // capa 2: rayos del contorno
    const a = rnd(0, Math.PI * 2), [x, y] = heartXY(a, 16), ang = Math.atan2(y, x) + rnd(-.35, .35), len = rnd(10, 32);
    out.push([x + rnd(-2, 2), y + rnd(-2, 2), x + len * Math.cos(ang), y + len * Math.sin(ang), rgb(1, rnd(.45, .75), rnd(.75, .95)), rnd(.4, .9)]);
  }
  return out;
}
function drawUpTo(L, n){
  for (; L.drawn < n; L.drawn++){
    const s = L.strokes[L.drawn];
    L.gc.strokeStyle = s[4]; L.gc.lineWidth = Math.max(.75, s[5] * S * 1.2);
    L.gc.beginPath(); L.gc.moveTo(mapX(s[0]), mapY(s[1])); L.gc.lineTo(mapX(s[2]), mapY(s[3])); L.gc.stroke();
  }
}

/* El corazón NUNCA deja de formarse: dos capas se relevan.
   Una se dibuja trazo a trazo (9 s); cuando termina se desvanece (3 s) y empieza de nuevo con trazos nuevos,
   mientras la otra ya va dibujándose. Así siempre hay un corazón completo y otro naciendo. */
const FORM = 9, FADE = 3;
window.__restarts = 0;
function startLayer(L, now){
  L.gc.clearRect(0, 0, W, H); L.strokes = makeStrokes(); L.drawn = 0;
  L.t0 = now; L.phase = 'form'; L.cv.style.opacity = 1; window.__restarts++;
}
async function codeHeart(){
  window.__state = 'corazon';
  geom(); glow.classList.add('on');
  const [A, B] = LAYERS; let bOn = false;
  const frame = now => {
    if (!A.phase) startLayer(A, now);
    if (!bOn && (now - A.t0) * K / 1000 / FORM >= .66){ startLayer(B, now); bOn = true; }   // la segunda empieza al 66 %
    for (const L of LAYERS){
      if (L.phase === 'form'){
        const el = (now - L.t0) * K / 1000;
        drawUpTo(L, Math.floor(Math.min(1, el / FORM) * L.strokes.length));
        if (el >= FORM){
          drawUpTo(L, L.strokes.length); L.phase = 'fade'; L.tf = now;
          if (!window.__done){ window.__done = true; window.__state = 'fin'; LAYERS.forEach(x => x.cv.classList.add('beat')); }   // late suavemente
        }
      } else if (L.phase === 'fade'){
        const f = (now - L.tf) * K / 1000 / FADE;
        if (f >= 1) startLayer(L, now); else L.cv.style.opacity = String(1 - f);
      }
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
addEventListener('resize', () => {
  if (!LAYERS[0].phase) return;
  geom(); for (const L of LAYERS){ const n = L.drawn; L.drawn = 0; drawUpTo(L, n); }
});

/* =====================================================================
   PÁGINA 1 → HISTORIA
   ===================================================================== */
const heartBtn = $('#heart');
let started = false;
function burst(){
  const b = Math.min(innerWidth, innerHeight * .6);
  for (let i = 0; i < 16; i++){
    const s = document.createElement('span'); s.className = 'bh'; s.textContent = '♥\uFE0E';
    s.style.fontSize = rnd(14, 30) + 'px'; document.body.appendChild(s);
    const a = rnd(0, Math.PI * 2), d = rnd(.35, .9) * b, ex = Math.cos(a) * d, ey = Math.sin(a) * d - b * .08;
    s.animate([{ transform: 'translate(-50%,-50%) scale(.4)', opacity: 0 },
               { transform: `translate(calc(-50% + ${ex * .5}px),calc(-50% + ${ey * .5}px)) scale(1)`, opacity: 1, offset: .35 },
               { transform: `translate(calc(-50% + ${ex}px),calc(-50% + ${ey}px)) scale(.6) rotate(${rnd(-40, 40)}deg)`, opacity: 0 }],
              { duration: rnd(1000, 1600) / K, easing: 'cubic-bezier(.15,.7,.3,1)', fill: 'forwards' }).onfinish = () => s.remove();
  }
}
heartBtn.addEventListener('click', async () => {
  if (started) return; started = true;
  Music.start();                                                    // la música empieza aquí y sigue hasta el final
  heartBtn.style.pointerEvents = 'none';
  $('#hint').style.transition = 'opacity .5s'; $('#hint').style.animation = 'none'; $('#hint').style.opacity = 0;
  const img = heartBtn.querySelector('img'), glow = heartBtn.querySelector('.glow');
  img.style.animation = 'none'; glow.style.animation = 'none';
  heartBtn.querySelectorAll('.ring').forEach(r => r.style.display = 'none');
  img.animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.32)', opacity: 1, offset: .22 }, { transform: 'scale(3.6)', opacity: 0 }],
              { duration: 1200 / K, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'forwards' });
  glow.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 1200 / K, fill: 'forwards' });
  $('#bloom').animate([{ opacity: 0 }, { opacity: .85, offset: .3 }, { opacity: 0 }], { duration: 1500 / K, fill: 'forwards' });
  burst();
  window.__state = 'carta';
  await sleep(1900);
  heartBtn.style.display = 'none'; $('#hint').style.display = 'none';

  for (const b of BLOCKS) await typeBlock(b);                       // 1) la carta, por partes
  window.__state = 'frases';
  await sleep(500);
  for (let i = 0; i < PHRASES.length; i++) await showPhrase(PHRASES[i], i === PHRASES.length - 1);   // 2) las frases
  await sleep(1500);                                                // 3) queda solo el fondo…
  await codeHeart();                                                // 4) …y aparece solo el corazón de tu código
});
</script>
